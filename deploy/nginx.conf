# ================================================================
#  Nginx Configuration - Lotofácil Platform
#  Reverse proxy para Web + AI Engine
# ================================================================

# HTTP Server (redireciona para HTTPS se configurado)
server {
    listen 80;
    server_name _;  # Substitua pelo seu domínio: loteria.seusite.com

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ==================== WEB APP (Node.js) ====================
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==================== AI ENGINE (FastAPI) ====================
    location /ai/ {
        # Remove o prefixo /ai/ antes de passar para o FastAPI
        rewrite ^/ai/(.*) /$1 break;
        
        proxy_pass http://ai-engine:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Aumentar timeout para requisições de evolução da IA
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ==================== HEALTH CHECK ====================
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ==================== ESTATÍSTICAS DO NGINX ====================
    location /nginx-status {
        stub_status on;
        allow 127.0.0.1;
        deny all;
    }
}

